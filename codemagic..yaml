workflows:
  nara-ios-testflight:
    name: NARA iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - codemagic_app_store_credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.naraaapp.nara
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
        APP_STORE_CONNECT_KEY_IDENTIFIER: "B3V9D5FV3U"
        APP_STORE_CONNECT_ISSUER_ID: "YOUR_ISSUER_ID_HERE"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Set up keychain to be used for code signing
        script: |
          keychain initialize

      - name: Fetch signing files with auto-create (FIXAR No matching profiles)
        script: |
          # Detta kommandot SKAPAR profilen automatiskt om den saknas
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up signing certificate
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update && cd ..

      - name: Flutter analyze
        script: |
          flutter analyze

      - name: Flutter build IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - NARA Testers
