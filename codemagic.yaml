workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
      xcode: latest
    scripts:
      - name: Fix Bundle ID 3 a
        script: |
          sed -i '' 's/com.naralabs.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj
          sed -i '' 's/se.naraapp.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_STYLE = Manual/CODE_SIGN_STYLE = Automatic/g' NARA.xcodeproj/project.pbxproj
          sed -i '' 's/Apple Distribution/Apple Development/g' NARA.xcodeproj/project.pbxproj
          sed -i '' '/PROVISIONING_PROFILE_SPECIFIER/d' NARA.xcodeproj/project.pbxproj
      - name: Keychain + Profil
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "NARA.xcodeproj" --scheme "NARA" --archive-flags "CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY=Apple Development -allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
