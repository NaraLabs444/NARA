workflows:
  nara-ios-testflight:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Codemagic2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: se.naraaapp.nara
      vars:
        XCODE_PROJECT: "NARA.xcodeproj"
        XCODE_SCHEME: "NARA"
      xcode: latest
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files se.naraaapp.nara --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - NARA Testers
