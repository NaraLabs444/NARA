workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_WORKSPACE: "NARA.xcworkspace"
        XCODE_SCHEME: "NARA"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain initialize
          keychain add-certificates
      - name: Set up provisioning profile
        script: |
          xcode-project use-profiles
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" --target NARA
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app-store-connect:
        auth: integration
        submission:
          type: testflight
