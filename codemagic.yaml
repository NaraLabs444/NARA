workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect_api_key:
        key_id: B3V9D5FV3U
        issuer_id: f600fee7-33d7-452f-886d-b59a96f68f02
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Install pods
        script: |
          cd ios && pod install
      - name: Build IPA
        script: |
          xcode-project build-ipa --workspace ios/Runner.xcworkspace --scheme Runner
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: Codemagic2
        submit_to_testflight: true
        beta_groups:
          - Golf Testers
