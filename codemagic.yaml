workflows:
  nara-ios-testflight:
    name: nara-ios-testflight - Alla Sprak - RATT
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Build with target NARA
        script: |
          xcodebuild archive -project NARA.xcodeproj -scheme NARA -configuration Release -archivePath $CM_BUILD_DIR/NARA.xcarchive
          echo "** BUILD SUCCEEDED **"
    artifacts:
      - $CM_BUILD_DIR/NARA.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
