workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          BUNDLE=$(xcode-project detect-bundle-id --project NARA.xcodeproj)
          echo "Bundle is: $BUNDLE"
          app-store-connect fetch-signing-files $BUNDLE --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project NARA.xcodeproj --scheme NARA
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
