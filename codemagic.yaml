workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: se.naraapp.nara
        XCODE_PROJECT: NARA.xcodeproj
        XCODE_SCHEME: NARA
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --project $XCODE_PROJECT
      - name: Build IPA
        script: |
          xcode-project build-ipa --project $XCODE_PROJECT --scheme $XCODE_SCHEME
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
