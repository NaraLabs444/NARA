workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_SCHEME: "NARA"
      xcode: latest
    scripts:
      - name: 1 Fix Bundle ID till 3 a
        script: |
          sed -i '' 's/com.naralabs.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj
          sed -i '' 's/se.naraapp.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj
          echo "Bundle ID fixat till se.naraaapp.nara"
      - name: 2 Keychain och Certifikat
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --bundle-identifier "$BUNDLE_ID"
      - name: 3 Bygg IPA med Automatic Signing
        script: |
          echo "Skapar ExportOptions"
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          PLIST
          echo "Arkiverar med Automatic"
          xcodebuild -project "NARA.xcodeproj" -scheme "$XCODE_SCHEME" -configuration Release -archivePath "build/ios/xcarchive/NARA.xcarchive" archive CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates COMPILER_INDEX_STORE_ENABLE=NO
          echo "Exportera IPA"
          xcodebuild -exportArchive -archivePath "build/ios/xcarchive/NARA.xcarchive" -exportPath "build/ios/ipa" -exportOptionsPlist "/tmp/ExportOptions.plist" -allowProvisioningUpdates
          ls -lh build/ios/ipa/
          echo "IPA KLAR"
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - NARA Testare
