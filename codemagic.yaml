workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_STORE --create --verbose
          keychain add-certificates --verbose
          xcode-project use-profiles --project NARA.xcodeproj --verbose
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/
      - name: Build IPA
        script: |
          xcode-project build-ipa --project NARA.xcodeproj --scheme NARA --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
