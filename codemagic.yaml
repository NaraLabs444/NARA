workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          BUNDLE=$(xcode-project detect-bundle-id --project NARA.xcodeproj 2>/dev/null || echo "com.naralabs.NARA")
          echo "Bundle: $BUNDLE"
          app-store-connect fetch-signing-files $BUNDLE --type IOS_APP_STORE --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles"
      - name: Build IPA automatic
        script: |
          xcodebuild -project NARA.xcodeproj -scheme NARA -configuration Release archive -archivePath build/NARA.xcarchive CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=W5RH5H66ZG -allowProvisioningUpdates
          mkdir -p build/ios/ipa
          echo '{"method":"app-store"}' > /tmp/options.json
          xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/options.json -allowProvisioningUpdates
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
