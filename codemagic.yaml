workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Fix file locations
        script: |
          mkdir -p NARA
          if [ -f Info.plist ]; then cp Info.plist NARA/Info.plist; fi
          if [ -f LaunchScreen.storyboard ]; then cp LaunchScreen.storyboard NARA/LaunchScreen.storyboard; fi
          if [ -f NARAApp.swift ]; then cp NARAApp.swift NARA/NARAApp.swift; fi
          ls -la NARA/
      - name: Set up code signing
        script: |
          echo "Fetching signing files..."
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_STORE --create || true
          xcode-project use-profiles --warn-only || true
          keychain initialize
          app-store-connect fetch-signing-files com.naralabs.NARA -p IOS_APP_STORE --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true
      - name: Build IPA for TestFlight
        script: |
          xcode-project build-ipa --project NARA.xcodeproj --scheme NARA --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testing
