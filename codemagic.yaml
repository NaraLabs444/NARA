workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
    scripts:
      - name: Set up signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_DEVELOPMENT --create
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_ADHOC --create || true
          keychain add-certificates
          xcode-project use-profiles
          echo "Profiles:"
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ | tail -20
      - name: Build IPA
        script: |
          xcodebuild -project NARA.xcodeproj -scheme NARA -configuration Release archive -archivePath build/NARA.xcarchive DEVELOPMENT_TEAM=W5RH5H66ZG CODE_SIGN_STYLE=Manual
          mkdir -p build/ios/ipa
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>W5RH5H66ZG</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
