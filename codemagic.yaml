workflows:
  nara-ios-release:
    name: NARA iOS Release - Alla Sprak - RATT
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fix and Build - Alla Sprak - TARGET NARA RATT
        script: |
          echo "=== Bygger NÄRA för ALLA SPRÅK - TARGET NARA ==="
          mkdir -p NARA
          cp NARA.xcodeproj/Info.plist NARA/ 2>/dev/null || true
          cp NARA.xcodeproj/NARAApp.swift NARA/ 2>/dev/null || true
          cp NARA.xcodeproj/LaunchScreen.storyboard NARA/ 2>/dev/null || true
          cp Info.plist NARA/ 2>/dev/null || true
          cp NARAApp.swift NARA/ 2>/dev/null || true
          cp LaunchScreen.storyboard NARA/ 2>/dev/null || true
          echo "Bygger med -target NARA - DETTA AR RATT!"
          xcodebuild -project NARA.xcodeproj -target NARA -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO build
    artifacts:
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - susannewessman@hotmail.com
