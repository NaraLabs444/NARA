workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        PROFILE_NAME: "se.naraaapp.nara App Store"
    scripts:
      - name: Skapa filer och fix
        script: |
          mkdir -p NARA
          if [ ! -f NARA/Info.plist ]; then
          cat > NARA/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>se.naraaapp.nara</string>
            <key>CFBundleDisplayName</key><string>NARA</string>
            <key>CFBundleName</key><string>NARA</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          EOF
          fi
          if [ ! -f NARA/LaunchScreen.storyboard ]; then
          cat > NARA/LaunchScreen.storyboard << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="21701" targetRuntime="AppleSDK" useAutolayout="YES" launchScreen="YES" useSafeAreas="YES" initialViewController="01J-lp-oVM">
          <device id="retina6_1" orientation="portrait" appearance="light"/>
          <dependencies><plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="21678"/></dependencies>
          <scenes><scene sceneID="EHf-IW-A2E"><objects><viewController id="01J-lp-oVM" sceneMemberID="viewController"><view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3"><rect key="frame" x="0.0" y="0.0" width="414" height="896"/><subviews><label opaque="NO" text="NARA" textAlignment="center" translatesAutoresizingMaskIntoConstraints="NO" id="kId"><rect key="frame" x="20" y="421" width="374" height="54"/><fontDescription key="fontDescription" type="boldSystem" pointSize="45"/></label></subviews><viewLayoutGuide key="safeArea" id="6Tk"/><color key="backgroundColor" systemColor="systemBackgroundColor"/><constraints><constraint firstItem="kId" firstAttribute="centerY" secondItem="Ze5-6b-2t3" secondAttribute="centerY" id="a"/><constraint firstItem="kId" firstAttribute="leading" secondItem="6Tk" secondAttribute="leading" constant="20" id="b"/><constraint firstItem="6Tk" firstAttribute="trailing" secondItem="kId" secondAttribute="trailing" constant="20" id="c"/></constraints></view></viewController></objects></scene></scenes></document>
          EOF
          fi
          sed -i '' 's/com\.naralabs\.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
      - name: Hämta grön profil och koppla den - TVINGA
        script: |
          set -x
          keychain initialize
          echo "Hämtar profil se.naraaapp.nara App Store..."
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create --verbose
          echo "=== Profiler nerladdade ==="
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          keychain add-certificates
          echo "=== Kopplar profil till projekt ==="
          xcode-project use-profiles --verbose || true
          # TVINGA in profilnamnet direkt i projektet om use-profiles missade
          echo "Tvingar PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = \"\";/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" NARA.xcodeproj/project.pbxproj || true
          sed -i '' "s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\";/g" NARA.xcodeproj/project.pbxproj || true
          # Sätt till Manual om det är Automatic
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' NARA.xcodeproj/project.pbxproj || true
          echo "=== Klar ==="
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "NARA.xcodeproj" --scheme "NARA" --verbose
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
