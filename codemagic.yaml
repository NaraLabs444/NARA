workflows:
  nara-ios-testflight:
    name: nara-ios-testflight - Alla Sprak - RATT
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up CocoaPods
        script: |
          cd ios && pod install --repo-update
      - name: Build with target NARA
        script: |
          cd ios
          xcodebuild -workspace NARA.xcworkspace -target NARA -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/NARA.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
