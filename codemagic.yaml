workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build NARA
        script: |
          xcodebuild -project NARA.xcodeproj -scheme NARA -configuration Release archive -archivePath build/NARA.xcarchive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/NARA.xcarchive/**
