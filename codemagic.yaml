workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
      vars:
        XCODE_PROJECT: "NARA.xcodeproj"
        XCODE_SCHEME: "NARA"
        BUNDLE_ID: "se.naraapp.nara"
        TEAM_ID: "W5RH5H66ZG"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Set up signing
        script: |
          xcode-project use-profiles --project "$XCODE_PROJECT" --bundle-ids "$BUNDLE_ID"
      - name: Build IPA
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -archivePath $HOME/build/ios/xcarchive/NARA.xcarchive \
            archive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$TEAM_ID \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -allowProvisioningUpdates
          xcodebuild -exportArchive \
            -archivePath $HOME/build/ios/xcarchive/NARA.xcarchive \
            -exportPath $HOME/build/ios/ipa \
            -allowProvisioningUpdates
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
