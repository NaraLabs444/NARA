workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_SCHEME: "NARA"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Återställ och fixa Bundle ID
        script: |
          echo "Återställer project.pbxproj till original från Git"
          git fetch origin main || true
          git checkout origin/main -- NARA.xcodeproj/project.pbxproj || true
          echo "Fixar Bundle ID till se.naraaapp.nara"
          sed -i '' 's/com\.naralabs\.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
          sed -i '' 's/se\.naraapp\.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
          sed -i '' 's/com\.naraapp\.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
      - name: Set up code signing and create App Store profile
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create || true
          keychain add-certificates || true
          xcode-project use-profiles || true
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "NARA.xcodeproj" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
