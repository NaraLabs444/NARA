workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Fix file locations
        script: |
          mkdir -p NARA
          echo "Before fix:"
          ls -la
          ls -la NARA/ || true
          if [ -f Info.plist ]; then cp Info.plist NARA/Info.plist; echo "Copied Info.plist"; fi
          if [ -f LaunchScreen.storyboard ]; then cp LaunchScreen.storyboard NARA/LaunchScreen.storyboard; echo "Copied LaunchScreen"; fi
          if [ -f NARAApp.swift ]; then cp NARAApp.swift NARA/NARAApp.swift; echo "Copied NARAApp.swift"; fi
          # If files are in NARA/NARA nested
          if [ -f NARA/NARA/Info.plist ]; then cp NARA/NARA/Info.plist NARA/Info.plist; fi
          if [ -f NARA/NARA/NARAApp.swift ]; then cp NARA/NARA/NARAApp.swift NARA/NARAApp.swift; fi
          if [ -f NARA/NARA/LaunchScreen.storyboard ]; then cp NARA/NARA/LaunchScreen.storyboard NARA/LaunchScreen.storyboard; fi
          echo "After fix:"
          ls -la NARA/
      - name: Build for iOS TestFlight
        script: |
          xcodebuild archive -project NARA.xcodeproj -scheme NARA -configuration Release -destination 'generic/platform=iOS' -archivePath $CM_BUILD_DIR/NARA.xcarchive
    artifacts:
      - $CM_BUILD_DIR/NARA.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
