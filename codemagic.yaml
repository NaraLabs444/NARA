workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    integrations:
      apple_developer_portal: Codemagic2
      app_store_connect: Codemagic2
    environment:
      xcode: latest
    scripts:
      - name: Set up code signing
        script: xcode-project use-profiles --project NARA.xcodeproj
      - name: Build IPA
        script: xcode-project build-ipa --project NARA.xcodeproj --scheme NARA
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: Codemagic2
        submit_to_testflight: true
