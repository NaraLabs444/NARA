workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
      xcode: latest
    scripts:
      - name: Fix Bundle ID
        script: |
          sed -i '' 's/com.naralabs.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
          sed -i '' 's/se.naraapp.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
      - name: Keychain
        script: |
          keychain initialize
      - name: Build IPA - Fungerande Post
        script: |
          cat > /tmp/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict><key>method</key><string>app-store</string><key>signingStyle</key><string>automatic</string></dict>
          </plist>
          PLIST
          xcodebuild -project "NARA.xcodeproj" -scheme "NARA" -archivePath "build/ios/xcarchive/NARA.xcarchive" archive CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates COMPILER_INDEX_STORE_ENABLE=NO
          xcodebuild -exportArchive -archivePath "build/ios/xcarchive/NARA.xcarchive" -exportPath "build/ios/ipa" -exportOptionsPlist /tmp/ExportOptions.plist -allowProvisioningUpdates
    artifacts:
      - build/ios/ipa/*.ipa
