workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_SCHEME: "NARA"
      xcode: latest
    scripts:
      - name: 1 Fix Bundle ID (3 a)
        script: |
          sed -i '' 's/com.naralabs.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
          sed -i '' 's/se.naraapp.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
      - name: 2 Code signing - skapar profil
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles --bundle-identifier "$BUNDLE_ID"
      - name: 3 Build IPA - AUTOMATIC (fixen för ditt fel)
        script: |
          xcode-project build-ipa --project "NARA.xcodeproj" --scheme "$XCODE_SCHEME" --archive-flags "CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
