workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Auto-create certificate and profile
        script: |
          keychain initialize
          # Skapa distribution cert automatiskt om det saknas
          app-store-connect certificates generate --type IOS_DISTRIBUTION --save || true
          sleep 2
          # Skapa/hämta provisioning profile
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_STORE --create --verbose
          keychain add-certificates
          xcode-project use-profiles --verbose
      - name: Build IPA
        script: |
          xcode-project build-ipa --project NARA.xcodeproj --scheme NARA --config Release --verbose
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        beta_groups:
          - Internal Testing
