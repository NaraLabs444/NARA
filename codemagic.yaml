workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fix Bundle ID
        script: |
          sed -i '' 's/com.naralabs.NARA/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
          sed -i '' 's/se.naraapp.nara/se.naraaapp.nara/g' NARA.xcodeproj/project.pbxproj || true
      - name: Keychain
        script: |
          keychain initialize
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "NARA.xcodeproj" --scheme "NARA"
    artifacts:
      - build/ios/ipa/*.ipa
