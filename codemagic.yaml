workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Fix filer
        script: |
          mkdir -p NARA
          cat > NARA/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleIdentifier</key><string>se.naraaapp.nara</string>
            <key>CFBundleDisplayName</key><string>NARA</string>
            <key>CFBundleName</key><string>NARA</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>UILaunchStoryboardName</key><string>LaunchScreen</string>
            <key>UISupportedInterfaceOrientations</key><array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          EOF
      - name: Build med automatisk signing
        script: |
          keychain initialize
          xcodebuild -project NARA.xcodeproj -scheme NARA -archivePath build/NARA.xcarchive archive -allowProvisioningUpdates CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=W5RH5H66ZG -verbose
          xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ipa -exportOptionsPlist /Users/builder/export_options.plist || xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ipa -exportOptionsPlist <(echo '{"method":"app-store","teamID":"W5RH5H66ZG"}')
    artifacts:
      - build/ipa/*.ipa
      - build/NARA.xcarchive/**
