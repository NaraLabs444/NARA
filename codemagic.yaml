workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: NARA.xcodeproj
        XCODE_SCHEME: NARA
    scripts:
      - name: Set up signing and build
        script: |
          keychain initialize
          BUNDLE=$(grep -r PRODUCT_BUNDLE_IDENTIFIER NARA.xcodeproj/project.pbxproj | head -1 | sed 's/.*= \(.*\);/\1/' | tr -d '"')
          echo "Actual Bundle ID in project: $BUNDLE"
          app-store-connect fetch-signing-files $BUNDLE --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files $BUNDLE --type IOS_APP_DEVELOPMENT --create
          keychain add-certificates
          xcode-project use-profiles
          ls ~/Library/MobileDevice/Provisioning\ Profiles/
          xcode-project build-ipa --project NARA.xcodeproj --scheme NARA --config Release
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
