workflows:
  nara-ios-release:
    name: NARA iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "se.naraaapp.nara"
        XCODE_SCHEME: "NARA"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Find Xcode files
        script: |
          echo "Letar efter projekt..."
          ls -la
          find . -name "*.xcworkspace" -o -name "*.xcodeproj" | head -20
      - name: Build IPA for TestFlight
        script: |
          if [ -d "NARA.xcworkspace" ]; then
            echo "Hittade NARA.xcworkspace"
            xcode-project build-ipa --workspace "NARA.xcworkspace" --scheme "$XCODE_SCHEME"
          elif [ -f "NARA.xcodeproj/project.pbxproj" ]; then
            echo "Hittade NARA.xcodeproj"
            xcode-project build-ipa --project "NARA.xcodeproj" --scheme "$XCODE_SCHEME"
          elif [ -d "NARA/NARA.xcworkspace" ]; then
            echo "Hittade NARA/NARA.xcworkspace"
            xcode-project build-ipa --workspace "NARA/NARA.xcworkspace" --scheme "$XCODE_SCHEME"
          elif [ -f "NARA/NARA.xcodeproj/project.pbxproj" ]; then
            echo "Hittade NARA/NARA.xcodeproj"
            xcode-project build-ipa --project "NARA/NARA.xcodeproj" --scheme "$XCODE_SCHEME"
          else
            WORKSPACE=$(find . -name "*.xcworkspace" | head -1)
            PROJECT=$(find . -name "*.xcodeproj" | head -1)
            if [ -n "$WORKSPACE" ]; then
              echo "Hittade workspace: $WORKSPACE"
              xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$XCODE_SCHEME"
            elif [ -n "$PROJECT" ]; then
              echo "Hittade project: $PROJECT"
              xcode-project build-ipa --project "$PROJECT" --scheme "$XCODE_SCHEME"
            else
              echo "Hittade ingen workspace eller project!"
              exit 1
            fi
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
