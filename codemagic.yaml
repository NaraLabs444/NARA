workflows:
  nara-ios-testflight:
    name: nara-ios-testflight - Alla Sprak - RATT
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up Pods if needed
        script: |
          if [ -f "ios/Podfile" ]; then cd ios && pod install --repo-update; elif [ -f "Podfile" ]; then pod install --repo-update; else echo "No Podfile - skipping"; fi
      - name: Build with target NARA
        script: |
          xcodebuild -workspace NARA.xcworkspace -target NARA -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/NARA.xcarchive archive CODE_SIGNING_ALLOWED=NO || xcodebuild -project NARA.xcodeproj -target NARA -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/NARA.xcarchive archive CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/ios/ipa/*.ipa
      - $CM_BUILD_DIR/NARA.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
