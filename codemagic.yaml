workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - app_store_connect
    scripts:
      - name: Fix file locations
        script: |
          mkdir -p NARA
          if [ -f Info.plist ]; then cp Info.plist NARA/Info.plist; fi
          if [ -f LaunchScreen.storyboard ]; then cp LaunchScreen.storyboard NARA/LaunchScreen.storyboard; fi
          if [ -f NARAApp.swift ]; then cp NARAApp.swift NARA/NARAApp.swift; fi
          ls -la NARA/
      - name: Set up code signing
        script: |
          xcode-project use-profiles --warn-only
      - name: Build for iOS TestFlight
        script: |
          xcodebuild archive -project NARA.xcodeproj -scheme NARA -configuration Release -destination 'generic/platform=iOS' -archivePath $CM_BUILD_DIR/NARA.xcarchive CODE_SIGN_STYLE=Automatic -allowProvisioningUpdates
    artifacts:
      - $CM_BUILD_DIR/NARA.xcarchive
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
