workflows:
  nara-ios-testflight:
    name: nara-ios-testflight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: NARA Key
    environment:
      xcode: latest
    scripts:
      - name: Build IPA
        script: |
          keychain initialize
          app-store-connect fetch-signing-files com.naralabs.NARA --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          xcodebuild -project NARA.xcodeproj -scheme NARA -configuration Release archive -archivePath build/NARA.xcarchive -allowProvisioningUpdates
          xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ios/ipa -allowProvisioningUpdates -exportOptionsPlist /tmp/ExportOptions.plist || xcodebuild -exportArchive -archivePath build/NARA.xcarchive -exportPath build/ios/ipa -allowProvisioningUpdates -exportOptionsPlist <(echo '{"method":"app-store"}')
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        api_key: NARA Key
        submit_to_testflight: true
